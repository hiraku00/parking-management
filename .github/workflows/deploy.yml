name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check production secrets are configured
        # Phase 6（本番構築）でCLOUDFLARE_API_TOKEN等をproduction Environmentの
        # Secretsに登録するまでは、以降のステップをスキップする（このワークフロー
        # 自体はPhase 5の時点で追加するが、実行はPhase 6のセットアップ後）。
        # 参照: docs/design/08-implementation-plan.md Phase 6
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "CLOUDFLARE_API_TOKEN が未設定のため、デプロイをスキップします（Phase 6で設定します）。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        # ci.yml と同じ理由（@cloudflare/vitest-plugin のピア依存起因のnpm不具合）。
        run: npm ci --legacy-peer-deps

      - name: Lint
        if: steps.check.outputs.skip != 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.check.outputs.skip != 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.check.outputs.skip != 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: npm run build

      - name: Apply D1 migrations (production)
        if: steps.check.outputs.skip != 'true'
        # 後方互換な変更（列・テーブル・索引の追加）のみを許可する運用。
        # 参照: docs/design/08-implementation-plan.md §8.3
        run: npx wrangler d1 migrations apply parking --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.skip != 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        if: steps.check.outputs.skip != 'true'
        run: ./scripts/smoke.sh "${{ vars.PRODUCTION_URL }}"
