# 一時ファイル（動作確認後に削除する）。deploy-alert.sh を実際のActions上で試す。
name: tmp-deploy-alert-test
on:
  pull_request:
    paths: ['.github/workflows/tmp-deploy-alert-test.yml']
permissions:
  contents: read
jobs:
  fail-then-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: わざと失敗させる
        run: exit 1
      - name: 失敗を通知する
        if: failure()
        run: ./scripts/deploy-alert.sh failure
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_TITLE: "テスト: デプロイ失敗通知の動作確認（自動で閉じます）"
  recover:
    needs: fail-then-alert
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: 復旧を通知して閉じる
        run: ./scripts/deploy-alert.sh success
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_TITLE: "テスト: 復旧"
